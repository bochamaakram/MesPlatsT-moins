            if (node.placeholder || (node.getAttribute && node.getAttribute('placeholder'))) {
              const currentPlaceholder = (node.getAttribute && node.getAttribute('placeholder')) || node.placeholder;
              const translated = translateText(currentPlaceholder);
              if (translated !== currentPlaceholder) {
                node.placeholder = translated;
                if (node.setAttribute) node.setAttribute('placeholder', translated);
              }
            }
            if (node.title || (node.getAttribute && node.getAttribute('title'))) {
              const currentTitle = (node.getAttribute && node.getAttribute('title')) || node.title;
              const translated = translateText(currentTitle);
              if (translated !== currentTitle) {
                node.title = translated;
                if (node.setAttribute) node.setAttribute('title', translated);
              }
            }
            for (const child of node.childNodes) walk(child);
          }
        };
        walk(document.body);
      }

      // Apply translations after React renders
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(applyTranslations, 100));
      } else {
        setTimeout(applyTranslations, 100);
      }

      // Re-apply when React updates the DOM (structure or in-place text).
      let observerTimer = null;
      const observer = new MutationObserver(() => {
        clearTimeout(observerTimer);
        observerTimer = setTimeout(applyTranslations, 30);
      });
      observer.observe(document.body, { childList: true, subtree: true, characterData: true });

      // Belt-and-suspenders: React may replace text in place right after a
      // mutation pass; re-scan a few times during startup to catch stragglers.
      let scans = 0;
      const scanTimer = setInterval(() => {
        applyTranslations();
        if (++scans >= 8) clearInterval(scanTimer);
      }, 350);
    </script>
    <div id="root"></div>
    <script>
    // Inject admin-managed documents into the "DOCUMENTATION PRATIQUE" section
    // (the compiled SPA cannot be rebuilt from this repository, so like the
    // translation overlay below we patch the rendered DOM at runtime).
    // Cards reuse the compiled bundle's exact markup so they inherit its styling.
    (function () {
        var docs = window.CMS_DOCUMENTS || [];
        if (!docs.length) return;

        var labels = {
            fr: { download: 'TÉLÉCHARGER', docx: 'DOCX' },
            en: { download: 'DOWNLOAD', docx: 'DOCX' },
            ar: { download: 'تحميل', docx: 'DOCX' }
        };
        var t = labels[window.__MPT_LOCALE__ || 'fr'] || labels.fr;

        function esc(s) {
            return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        var sizeUnits = window.__MPT_LOCALE__ === 'en'
            ? { b: 'B', kb: 'KB', mb: 'MB', dot: '.' }
            : { b: 'o', kb: 'Ko', mb: 'Mo', dot: ',' };

        function humanSize(bytes) {
            bytes = Number(bytes) || 0;
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1).replace('.', sizeUnits.dot) + ' ' + sizeUnits.mb;
            if (bytes >= 1024) return Math.round(bytes / 1024) + ' ' + sizeUnits.kb;
            if (bytes > 0) return bytes + ' ' + sizeUnits.b;
            return '';
        }

        function formatOf(d) {
            if (d.pdf_url) return 'PDF';
            var m = String(d.url || d.file_name || '').match(/\.(\w+)$/);
            return m ? m[1].toUpperCase() : 'FILE';
        }

        function icons(name) {
            if (name === 'file') {
                return '<svg class="absolute block inset-0 size-full" fill="none" height="20" preserveAspectRatio="none" viewBox="0 0 20 20" width="20"><g id="file-code"><path d="M11.6665 1.666H5.0005C4.55852 1.666 4.13464 1.84161 3.82211 2.1542C3.50958 2.46678 3.334 2.89074 3.334 3.3328V16.6672C3.334 17.1093 3.50958 17.5332 3.82211 17.8458C4.13464 18.1584 4.55852 18.334 5.0005 18.334H14.9995C15.4415 18.334 15.8654 18.1584 16.1779 17.8458C16.4904 17.5332 16.666 17.1093 16.666 16.6672V6.6664M11.6665 1.666C11.9303 1.66558 12.1915 1.71734 12.4352 1.81832C12.6789 1.9193 12.9002 2.0675 13.0864 2.25438L16.0761 5.24462C16.2634 5.43089 16.412 5.65244 16.5133 5.89647C16.6145 6.14051 16.6664 6.40219 16.666 6.6664M11.6665 1.666V5.833C11.6665 6.05403 11.7543 6.26601 11.9106 6.4223C12.0668 6.57859 12.2788 6.6664 12.4997 6.6664L16.666 6.6664M8.3335 10.4167L6.667 12.5002L8.3335 14.5837M11.6665 10.4167L13.333 12.5002L11.6665 14.5837" id="Vector" stroke="#4B5563" stroke-linecap="round" stroke-width="2"></path></g></svg>';
            }
            return '<svg class="absolute block inset-0 size-full" fill="none" height="14" preserveAspectRatio="none" viewBox="0 0 14 14" width="14"><g clip-path="url(#mptc0_0_8)" id="download"><path d="M7 8.75V1.75M9.91667 5.83333L7 8.75L4.08333 5.83333M12.25 8.75V11.0833C12.25 11.3928 12.1271 11.6895 11.9083 11.9083C11.6895 12.1271 11.3928 12.25 11.0833 12.25H2.91667C2.60725 12.25 2.3105 12.1271 2.09171 11.9083C1.87292 11.6895 1.75 11.3928 1.75 11.0833V8.75" id="Vector" stroke="#111827" stroke-linecap="round" stroke-width="2"></path></g><defs><clipPath id="mptc0_0_8"><rect fill="white" height="14" width="14"></rect></clipPath></defs></svg>';
        }

        function card(d) {
            var meta = formatOf(d);
            var size = humanSize(d.pdf_size != null ? d.pdf_size : d.size);
            if (size) meta += ' (' + size + ')';

            var links = '';
            if (d.pdf_url) {
                links += '<a class="mpt-doc-btn-primary" download="" href="' + esc(d.pdf_url) + '">' +
                    '<span style="display:inline-block;width:14px;height:14px;position:relative;margin-right:2px;">' + icons('download') + '</span>' +
                    '<span>' + esc(t.download) + '</span></a>';
            }
            links += '<a class="mpt-doc-btn-secondary" download="" href="' + esc(d.url) + '">' +
                '<span>' + esc(t.docx) + '</span></a>';

            return '<div class="mpt-doc-card" data-name="doc-card" data-title="' + esc((d.title || '').toLowerCase()) + '" data-desc="' + esc((d.description || '').toLowerCase()) + '">' +
                '<div class="mpt-doc-icon-box">' + icons('file') + '</div>' +
                '<div class="mpt-doc-content">' +
                    '<span class="mpt-doc-badge">' + esc(meta) + '</span>' +
                    '<h4 class="mpt-doc-title">' + esc(d.title) + '</h4>' +
                    (d.description ? '<p class="mpt-doc-desc">' + esc(d.description) + '</p>' : '') +
                    '<div class="mpt-doc-actions">' + links + '</div>' +
                '</div>' +
            '</div>';
        }

        function setupRegulationsFeatures() {
            // 1. Auto-expand accordions when clicking "#doc-..." category links
            if (!window.__mptHashBound) {
                window.__mptHashBound = true;
                document.addEventListener('click', function (e) {
                    var a = e.target.closest('a[href^="#doc-"]');
                    if (!a) return;
                    var targetId = a.getAttribute('href');
                    var el = document.querySelector(targetId);
                    if (!el) return;
                    e.preventDefault();
                    var btn = el.querySelector('button');
                    if (btn) {
                        var isExpanded = !!el.querySelector('[data-name="chevron-up"]');
                        if (!isExpanded) {
                            btn.click();
                        }
                    }
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            }

            // 2. Interactive live search in Hero
            var heroInput = document.querySelector('[data-name="hero"] input[type="text"]');
            var heroBtn = document.querySelector('[data-name="hero"] [class*="bg-[#237d27]"]');
            if (heroInput && !heroInput.dataset.searchBound) {
                heroInput.dataset.searchBound = 'true';

                function doFilter() {
                    var query = heroInput.value.trim().toLowerCase();
                    var docCards = document.querySelectorAll('.mpt-doc-card');
                    var matchCount = 0;
                    docCards.forEach(function (c) {
                        var title = c.getAttribute('data-title') || '';
                        var desc = c.getAttribute('data-desc') || '';
                        if (!query || title.includes(query) || desc.includes(query)) {
                            c.style.display = 'flex';
                            matchCount++;
                        } else {
                            c.style.display = 'none';
                        }
                    });

                    var noResults = document.querySelector('.mpt-doc-no-results');
                    var docContainer = document.querySelector('.mpt-documents');
                    if (!noResults && docContainer) {
                        noResults = document.createElement('div');
                        noResults.className = 'mpt-doc-no-results';
                        noResults.style.cssText = 'grid-column:1/-1;text-align:center;padding:32px 16px;color:#64748b;font-size:14px;font-weight:500;';
                        docContainer.appendChild(noResults);
                    }
                    if (noResults) {
                        if (query && matchCount === 0) {
                            noResults.textContent = (window.__MPT_LOCALE__ === 'ar' ? 'لم يتم العثور على أي مستند مطابق لبحثكم.' : (window.__MPT_LOCALE__ === 'en' ? 'No documents found matching your search.' : 'Aucun document ne correspond à votre recherche.'));
                            noResults.style.display = 'block';
                        } else {
                            noResults.style.display = 'none';
                        }
                    }
                }

                heroInput.addEventListener('input', doFilter);
                heroInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        doFilter();
                        var docSection = document.querySelector('[data-name="documentation"]');
                        if (docSection) docSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                if (heroBtn) {
                    heroBtn.style.cursor = 'pointer';
                    heroBtn.addEventListener('click', function () {
                        doFilter();
                        var docSection = document.querySelector('[data-name="documentation"]');
                        if (docSection) docSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                }
            }
        }

        function tryInject() {
            var section = document.querySelector('[data-name="documentation"]');
            if (!section) return;
            if (section.querySelector('.mpt-documents')) {
                setupRegulationsFeatures();
                return;
            }

            var row = document.createElement('div');
            row.className = 'mpt-documents';
            row.innerHTML = docs.map(card).join('');

            section.appendChild(row);
            setupRegulationsFeatures();
        }

        var obs = new MutationObserver(function () { tryInject(); });
        obs.observe(document.body, { childList: true, subtree: true });
        tryInject();
        var timer = setInterval(function () { tryInject(); if (sectionInjected()) clearInterval(timer); }, 400);
        function sectionInjected() {
            return !!document.querySelector('.mpt-documents');
        }
        setTimeout(function () { clearInterval(timer); obs.disconnect(); }, 20000);
    })();

    // Interactive Newsletter Form for the Regulations page & responsive banners
    (function () {
        var translations = {
            fr: {
                placeholder: "Votre adresse e-mail professionnel...",
                button: "JE M'INSCRIS",
                buttonLoading: "INSCRIPTION...",
                consent: "En cochant cette case, j'accepte de recevoir des communications techniques et réglementaires sur la sécurité alimentaire. Vous pouvez vous désinscrire à tout moment.",
                success: "Merci ! Vous êtes inscrit(e).",
                reset: "Nouvelle inscription",
                errEmail: "Veuillez saisir une adresse e-mail valide.",
                errConsent: "Veuillez cocher la case pour accepter les communications.",
                errGeneral: "Erreur, veuillez réessayer."
            },
            en: {
                placeholder: "Your professional e-mail address...",
                button: "I SUBSCRIBE",
                buttonLoading: "SUBSCRIBING...",
                consent: "By checking this box, I accept receiving technical and regulatory communications on food safety. You can unsubscribe at any time.",
                success: "Thank you! You have subscribed.",
                reset: "New subscription",
                errEmail: "Please enter a valid email address.",
                errConsent: "Please check the box to accept communications.",
                errGeneral: "Error, please try again."
            },
            ar: {
                placeholder: "بريدكم الإلكتروني المهني...",
                button: "أسجل اشتراكي",
                buttonLoading: "جاري التسجيل...",
                consent: "بالتأشير على هذه الخانة، أوافق على تلقي المراسلات التقنية والتنظيمية المتعلقة بسلامة الأغذية. يمكنكم إلغاء الاشتراك في أي وقت.",
                success: "شكراً لكم! لقد تم تسجيل اشتراككم.",
                reset: "اشتراك جديد",
                errEmail: "يرجى إدخال بريد إلكتروني صالح.",
                errConsent: "يرجى التأشير على الخانة للموافقة على المراسلات.",
                errGeneral: "حدث خطأ، يرجى إعادة المحاولة."
            }
        };

        function getXsrfToken() {
            var m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
            return m ? decodeURIComponent(m[1]) : '';
        }

        function createFormElement(lang) {
            var t = translations[lang] || translations.fr;
            var form = document.createElement('form');
            form.className = 'mpt-newsletter-form';
            form.setAttribute('novalidate', 'true');
            form.setAttribute('data-lang', lang);

            form.innerHTML =
                '<div class="mpt-newsletter-row">' +
                    '<input type="email" class="mpt-newsletter-input" placeholder="' + t.placeholder + '" required aria-label="' + t.placeholder + '">' +
                    '<button type="submit" class="mpt-newsletter-btn">' + t.button + '</button>' +
                '</div>' +
                '<label class="mpt-newsletter-consent">' +
                    '<input type="checkbox" class="mpt-newsletter-checkbox" required>' +
                    '<span class="mpt-newsletter-consent-text">' + t.consent + '</span>' +
                '</label>' +
                '<div class="mpt-newsletter-feedback" role="alert"></div>';

            var input = form.querySelector('.mpt-newsletter-input');
            var submitBtn = form.querySelector('.mpt-newsletter-btn');
            var checkbox = form.querySelector('.mpt-newsletter-checkbox');
            var feedback = form.querySelector('.mpt-newsletter-feedback');
            var row = form.querySelector('.mpt-newsletter-row');
            var consentLabel = form.querySelector('.mpt-newsletter-consent');

            function showError(msg) {
                feedback.className = 'mpt-newsletter-feedback is-error';
                feedback.innerHTML = '<span>' + msg + '</span>';
                feedback.style.display = 'block';
            }

            function showSuccess() {
                row.style.display = 'none';
                consentLabel.style.display = 'none';
                feedback.className = 'mpt-newsletter-feedback is-success';
                feedback.innerHTML =
                    '<p style="font-weight:700;font-size:15px;margin:0;">' + t.success + '</p>' +
                    '<button type="button" class="mpt-newsletter-reset-btn">' + t.reset + '</button>';
                feedback.style.display = 'flex';

                var resetBtn = feedback.querySelector('.mpt-newsletter-reset-btn');
                resetBtn.addEventListener('click', function () {
                    input.value = '';
                    checkbox.checked = false;
                    row.style.display = 'flex';
                    consentLabel.style.display = 'flex';
                    feedback.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.textContent = t.button;
                });
            }

            input.addEventListener('input', function () {
                if (feedback.classList.contains('is-error')) {
                    feedback.style.display = 'none';
                }
            });
            checkbox.addEventListener('change', function () {
                if (feedback.classList.contains('is-error')) {
                    feedback.style.display = 'none';
                }
            });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                var emailVal = input.value.trim();

                if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
                    showError(t.errEmail);
                    input.focus();
                    return;
                }

                if (!checkbox.checked) {
                    showError(t.errConsent);
                    checkbox.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = t.buttonLoading;
                feedback.style.display = 'none';

                try {
                    var res = await fetch('/contact', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-XSRF-TOKEN': getXsrfToken()
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            name: 'Abonné Newsletter',
                            company: '-',
                            email: emailVal,
                            phone: '-',
                            subject: 'Newsletter — Inscription à la lettre d\'information',
                            message: 'Inscription newsletter depuis la page réglementation. Email: ' + emailVal,
                            consent: true
                        })
                    });

                    if (res.ok) {
                        showSuccess();
                    } else {
                        var data = await res.json().catch(function () { return {}; });
                        var errText = (data.errors && data.errors.email && data.errors.email[0]) || t.errGeneral;
                        showError(errText);
                        submitBtn.disabled = false;
                        submitBtn.textContent = t.button;
                    }
                } catch (err) {
                    showError(t.errGeneral);
                    submitBtn.disabled = false;
                    submitBtn.textContent = t.button;
                }
            });

            return form;
        }

        function upgradeNewsletterForms() {
            var lang = window.__MPT_LOCALE__ || document.documentElement.lang || 'fr';

            // Desktop variant
            var desktopSections = document.querySelectorAll('[data-name="newsletter-fond-toile-verre"]');
            desktopSections.forEach(function (sec) {
                var existing = sec.querySelector('.mpt-newsletter-form');
                if (existing) {
                    if (existing.getAttribute('data-lang') !== lang) {
                        existing.parentNode.replaceChild(createFormElement(lang), existing);
                    }
                    return;
                }
                var container = sec.querySelector('[class*="max-w-[1440px]"]') || sec.children[2] || sec;
                var fake = sec.querySelector('[class*="w-[500px]"]') || (container.children && container.children[1]);
                if (fake && fake.parentNode) {
                    fake.parentNode.replaceChild(createFormElement(lang), fake);
                } else if (container) {
                    container.appendChild(createFormElement(lang));
                }
            });

            // Tablet / Mobile variant
            var responsiveSections = document.querySelectorAll('[data-name="newsletter"]');
            responsiveSections.forEach(function (sec) {
                var existing = sec.querySelector('.mpt-newsletter-form');
                if (existing) {
                    if (existing.getAttribute('data-lang') !== lang) {
                        existing.parentNode.replaceChild(createFormElement(lang), existing);
                    }
                    return;
                }
                var fakeConsent = sec.querySelector('[class*="flex gap-[8px]"]');
                var fakeRow = sec.querySelector('[class*="w-[358px]"], [class*="flex gap-[12px]"]');
                if (fakeConsent) fakeConsent.style.display = 'none';
                if (fakeRow && fakeRow.parentNode) {
                    fakeRow.parentNode.replaceChild(createFormElement(lang), fakeRow);
                } else {
                    sec.appendChild(createFormElement(lang));
                }
            });
        }

        var obs = new MutationObserver(function () {
            upgradeNewsletterForms();
        });
        obs.observe(document.body, { childList: true, subtree: true });

        window.addEventListener('popstate', function () {
            setTimeout(upgradeNewsletterForms, 50);
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', upgradeNewsletterForms);
        } else {
            upgradeNewsletterForms();
        }
    })();
    </script>
